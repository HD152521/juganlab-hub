name: trending

# 매일 한국 시간 00:10 에 AI 스킬 트렌딩을 갱신해 커밋한다. 일요일에는 주간 목록도 새로 만든다.
on:
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-trending.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 새 저장소의 한국어 요약용. 없으면 요약 없이 갱신된다
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: node build.mjs
      - name: 변경이 있으면 커밋
        run: |
          if git diff --quiet -- data/trending.json data/trending-ko.json; then
            echo "변경 없음"
          else
            git config user.name "juganlab-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/trending.json data/trending-ko.json
            git commit -m "chore: AI 스킬 트렌딩 갱신"
            git push
          fi
